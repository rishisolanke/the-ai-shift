name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Build the main site (The AI Shift) into dist/
      - run: npm ci
      - run: npm run build
      # Build the companion site (The Addiction Atlas) and nest it under dist/the-addiction-shift/
      - name: Build The Addiction Atlas
        working-directory: the-addiction-shift
        run: |
          npm ci
          npm run build
      - name: Nest Atlas into main site output
        run: |
          rm -rf dist/the-addiction-shift
          cp -r the-addiction-shift/dist dist/the-addiction-shift
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
